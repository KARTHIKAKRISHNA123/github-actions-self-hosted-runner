
name: Trusted Windows CI

on:
  push:
    branches:
      - main

# Minimum GitHub token permissions
permissions:
  contents: read

# Prevent overlapping executions
concurrency:
  group: windows-self-hosted-ci
  cancel-in-progress: true

jobs:
  build:
    name: Build on Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      # Step 1: Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Step 2: Verify runner environment
      - name: Check Windows Environment
        shell: pwsh
        run: |
          Write-Host "Windows Runner"
          hostname
          node --version
          npm --version

          if ((node --version) -notmatch '^v22\.') {
            throw "Node.js 22 is required on this runner."
          }

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build application
      - name: Build Application
        run: npm run build --if-present

      # Step 5: Run tests
      - name: Run Tests
        run: npm test
